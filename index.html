<!DOCTYPE html>
<html>
<head>
    <title>Ikon-L IAG - Visualizador de Ocultações</title>
    <meta charset="utf-8">
    <script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a1a; color: white; display: flex; flex-direction: column; height: 100vh; }
        #header { padding: 15px; background: #2c3e50; border-bottom: 2px solid #34495e; display: flex; align-items: center; gap: 20px; }
        #aladin-lite-div { flex-grow: 1; width: 100%; }
        .btn-upload { background: #27ae60; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; border: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div id="header">
        <strong>Ikon-L IAG (FOV 11.3')</strong>
        <label class="btn-upload">
            Selecionar CSV (ra, dec)
            <input type="file" id="csvFile" accept=".csv">
        </label>
        <span id="status" style="font-size: 0.8em; color: #bdc3c7;">Aguardando arquivo...</span>
    </div>
    <div id="aladin-lite-div"></div>

    <script type="text/javascript">
        // Inicializa o Aladin
        var aladin = A.aladin('#aladin-lite-div', {survey: "P/DSS2/color", fov: 1.0});
        var fovLayer = A.graphicOverlay({color: '#2ecc71', lineWidth: 2, name: 'Ikon-L IAG'});
        aladin.addOverlay(fovLayer);

        document.getElementById('csvFile').onchange = function(e) {
            var file = e.target.files[0];
            if (!file) return;
            
            var reader = new FileReader();
            reader.onload = function(event) {
                var lines = event.target.result.split(/\r?\n/);
                fovLayer.removeAll();
                var first = null;
                var count = 0;

                lines.forEach(function(line, i) {
                    if (i === 0 && line.toLowerCase().includes('ra')) return;
                    var cols = line.split(',');
                    if(cols.length >= 2) {
                        var ra = parseFloat(cols[0]);
                        var dec = parseFloat(cols[1]);
                        if(!isNaN(ra) && !isNaN(dec)) {
                            if(!first) first = [ra, dec];
                            // Desenha o polígono do Ikon-L IAG (11.3' x 11.3')
                            var v = [
                                [ra + (-150/3600), dec + (150/3600)],
                                [ra + (530/3600),  dec + (150/3600)],
                                [ra + (530/3600),  dec + (-530/3600)],
                                [ra + (-150/3600), dec + (-530/3600)]
                            ];
                            fovLayer.add(A.polygon(v));
                            count++;
                        }
                    }
                });
                if(first) {
                    aladin.gotoRaDec(first[0], first[1]);
                    document.getElementById('status').innerText = count + " campos plotados.";
                }
            };
            reader.readAsText(file);
        };
    </script>
</body>
</html>
